name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax, manifest, privacy policy, and tests
        run: npm run check
      - name: Package reviewed extension files
        run: |
          mkdir -p dist
          zip -j dist/cliptown-extension.zip manifest.json background-policy.js background.js content.js policy.js popup.html popup.js
          unzip -l dist/cliptown-extension.zip | tee dist/archive-contents.txt
          grep -q 'background-policy.js' dist/archive-contents.txt
          test "$(unzip -Z1 dist/cliptown-extension.zip | wc -l)" -eq 7
      - uses: actions/upload-artifact@v4
        with:
          name: cliptown-extension
          path: dist/cliptown-extension.zip
          if-no-files-found: error
