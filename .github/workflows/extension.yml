name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 6 1 * *"

permissions:
  contents: read

concurrency:
  group: cliptown-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/extension.yml
      - name: Use exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_ignore_scripts: "true"
          npm_config_update_notifier: "false"
        run: npm ci
      - name: Validate syntax, manifest, privacy policy, and tests
        run: npm run check
      - name: Package reviewed extension files deterministically
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            manifest.json
            background-policy.js
            background.js
            content.js
            policy.js
            popup.html
            popup.js
          )
          rm -rf dist
          mkdir -p dist/package
          for file in "${files[@]}"; do
            test -s "$file"
            cp "$file" dist/package/
          done

          if grep -R -nE \
            'gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|Bearer [A-Za-z0-9._-]{16,}' \
            dist/package; then
            echo 'packaged extension contains a credential-like marker' >&2
            exit 1
          fi

          find dist/package -type f -exec touch -t 198001010000 {} +
          (
            cd dist/package
            printf '%s\n' "${files[@]}" | LC_ALL=C sort | zip -X ../cliptown-extension.zip -@
          )
          unzip -l dist/cliptown-extension.zip | tee dist/archive-contents.txt
          test "$(unzip -Z1 dist/cliptown-extension.zip | wc -l)" -eq "${#files[@]}"
          for file in "${files[@]}"; do
            test "$(unzip -Z1 dist/cliptown-extension.zip | grep -Fxc "$file")" -eq 1
          done
          (
            cd dist
            sha256sum cliptown-extension.zip > SHA256SUMS
          )
      - name: Upload checksummed extension package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cliptown-extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/cliptown-extension.zip
            dist/SHA256SUMS
            dist/archive-contents.txt
          if-no-files-found: error
          retention-days: 14

  browser-privacy-tests:
    name: Real-browser privacy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_ignore_scripts: "true"
          npm_config_update_notifier: "false"
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run extension privacy tests in Chromium
        run: npm run test:browser
      - name: Upload Playwright failure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
