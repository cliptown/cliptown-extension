name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax, manifest, privacy policy, and tests
        run: npm run check
      - name: Package reviewed extension files
        run: |
          mkdir -p dist
          zip -j dist/cliptown-extension.zip manifest.json background.js content.js policy.js popup.html popup.js
          unzip -l dist/cliptown-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cliptown-extension
          path: dist/cliptown-extension.zip
          if-no-files-found: error
