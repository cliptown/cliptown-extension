name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 6 1 * *"

permissions:
  contents: read

concurrency:
  group: cliptown-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/extension.yml

      - name: Use exact Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Validate syntax, manifest, privacy policy, and tests
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_ignore_scripts: "true"
          npm_config_package_lock: "false"
          npm_config_update_notifier: "false"
        run: npm run check

      - name: Package reviewed extension files deterministically
        shell: bash
        run: |
          set -euo pipefail
          files=(
            manifest.json
            background-policy.js
            background.js
            content.js
            policy.js
            popup.html
            popup.js
          )
          rm -rf dist
          mkdir -p dist/package
          for file in "${files[@]}"; do
            test -s "$file"
            cp "$file" dist/package/
          done

          if grep -R -nE \
            'gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|Bearer [A-Za-z0-9._-]{16,}' \
            dist/package; then
            echo 'packaged extension contains a credential-like marker' >&2
            exit 1
          fi

          find dist/package -type f -exec touch -t 198001010000 {} +
          (
            cd dist/package
            printf '%s\n' "${files[@]}" | LC_ALL=C sort | zip -X ../cliptown-extension.zip -@
          )
          unzip -l dist/cliptown-extension.zip | tee dist/archive-contents.txt
          test "$(unzip -Z1 dist/cliptown-extension.zip | wc -l)" -eq "${#files[@]}"
          for file in "${files[@]}"; do
            test "$(unzip -Z1 dist/cliptown-extension.zip | grep -Fxc "$file")" -eq 1
          done
          (
            cd dist
            sha256sum cliptown-extension.zip > SHA256SUMS
          )

      - name: Upload checksummed extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cliptown-extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/cliptown-extension.zip
            dist/SHA256SUMS
            dist/archive-contents.txt
          if-no-files-found: error
          retention-days: 14
